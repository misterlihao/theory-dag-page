  dlg.showModal();
  return dlg;
}

function openCreateDialog(parents) {
  const chosen = [...(parents || [])];
  const err = h("div", { class: "err" });
  const idIn = h("input", { placeholder: "例如：高斯誤差下的最小平方" });
  const chips = h("div", { class: "chips" });
  const drawChips = () => {
    chips.replaceChildren(...chosen.map((p) => h("span", { class: "chip" }, p,
      h("button", { type: "button", onclick: () => { chosen.splice(chosen.indexOf(p), 1); drawChips(); } }, "×"))));
    const add = h("button", { type: "button", onclick: () => {
      const pk = picker(() => Object.keys(lib.nodes).filter((x) => !chosen.includes(x)),
        (p) => { chosen.push(p); drawChips(); }, () => drawChips());
      add.replaceWith(pk);
      pk.querySelector("input").focus();
    } }, "+ 加父節點");
    chips.append(add);
  };
  drawChips();
  const check = () => {
    const x = idIn.value.trim();
    if (!x) return "請輸入標題";
    if (Object.keys(lib.nodes).some((k) => k.toLowerCase() === x.toLowerCase())) return "已經有叫 " + x + " 的理論了";
    return "";
  };
  idIn.addEventListener("input", () => { err.textContent = idIn.value ? check() : ""; });
  const submit = async () => {
    const msg = check();
    if (msg) { err.textContent = msg; return; }
    const id = idIn.value.trim();
    try {
      await structural("create", () => ({ id, parents: chosen }));
      $("#dlg").close();
      navigate(id, { body: true });
    } catch (e) { err.textContent = e.message; }
  };
  idIn.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });
  openDialog(
    h("h3", {}, "新增理論"),
    h("div", { class: "field" }, h("label", {}, "標題 ", h("small", {}, TITLE_HINT_SHORT)), idIn),
    h("div", { class: "field" }, h("label", {}, "父節點 ", h("small", {}, "選填：已經知道它是誰的特例，就先掛上去")), chips),
    err,
    h("div", { class: "foot" },
      h("button", { onclick: () => $("#dlg").close() }, "取消"),
      h("button", { class: "primary", onclick: submit }, "建立")));
  idIn.focus();
}

function openAbstractDialog() {
  const ids = Object.keys(lib.nodes).filter((x) => picked.has(x)).sort();
  const common = commonParents(ids);
  const err = h("div", { class: "err" });
  const idIn = h("input", { placeholder: "說明這組理論共通的適用情境" });
  // the choice is where the new theory hangs; what that does to the old edges is the fine print
  const boxes = common.map((r) => ({ r, cb: h("input", { type: "checkbox", checked: true }), note: h("small") }));
  const relabel = () => {
    const a = idIn.value.trim() || "新理論";
    for (const b of boxes) {
      b.note.textContent = ids.join("、") + " 不再直接掛在 " + b.r + " 下，改經由 " + a + " 連上去";
    }
  };
  relabel();
  idIn.addEventListener("input", () => { relabel(); err.textContent = ""; });
  const submit = async () => {
    const id = idIn.value.trim();
    if (!id) { err.textContent = "請輸入標題"; return; }
    try {
      await structural("abstract", () => ({ id,
        children: ids.map((c) => ({ id: c, base: lib.nodes[c].hash })),
        rehang: boxes.filter((b) => b.cb.checked).map((b) => b.r) }));
      $("#dlg").close();
      selMode = false; picked.clear();
      flow = { id, children: ids };
      view = "abstract";
      selected = id;
      editorFor = null;
      render();
      $("#f-body") && $("#f-body").focus();
    } catch (e) { err.textContent = e.message; }
  };
  idIn.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });
  openDialog(
    h("h3", {}, "抽出上層"),
    h("p", { class: "muted", style: "margin-top:0" }, "選取的理論：" + ids.join("、")),
    h("div", { class: "field" }, h("label", {}, "標題 ", h("small", {}, TITLE_HINT_SHORT)), idIn),
    boxes.length ? h("div", { class: "field" }, h("label", {}, "新理論的父節點 ", h("small", {}, "選取的理論共同的父節點")),
      boxes.map((b) => h("label", { class: "chk" }, b.cb, h("span", {}, "掛在 " + b.r + " 下", b.note)))) : null,
    err,
    h("div", { class: "foot" },
      h("button", { onclick: () => $("#dlg").close() }, "取消"),
      h("button", { class: "primary", onclick: submit }, "建立")));
  idIn.focus();
}

async function toggleDisabled(id, disabled) {
  try {
    await structural("set_disabled", () => ({ id, base: lib.nodes[id].hash, disabled }));
  } catch (e) { setStatus("切換失敗：" + e.message, "err"); }
  renderEditor();
}

function openDeleteDialog(id) {
  const n = lib.nodes[id];
  const kids = childrenOf(id);
  const ups = n.parsed ? n.parents.filter((p) => lib.nodes[p]) : [];
  const err = h("div", { class: "err" });
  const sep = lib.dir.includes("\\") ? "\\" : "/";
  const submit = async () => {
    try {
      await structural("delete", () => ({ id, base: lib.nodes[id].hash,
        children: kids.map((c) => ({ id: c, base: lib.nodes[c].hash })) }));
      $("#dlg").close();
      // the workspace has nothing left to abstract: back to the main view
      if (flow && (flow.id === id || flow.children.includes(id))) {
        flow = null;
        view = "main";
        editorFor = undefined;      // the placeholder was just drawn into the workspace's editor
      }
      selected = null;
      render();
      setStatus("已刪除 " + id, "ok");
    } catch (e) { err.textContent = e.message; }
  };
  // a deleted root has nowhere to send its children: those with no other parent become roots
  const roots = ups.length ? [] : kids.filter((c) => !lib.nodes[c].parents.some((p) => p !== id && lib.nodes[p]));
  let kidsPart = null;
  if (kids.length) {
    kidsPart = h("div", { class: "field" },
      h("p", { style: "margin:0" }, ups.length
        ? "子節點 " + kids.join("、") + " 會改掛到 " + ups.join("、") + " 下。"
        : roots.length === kids.length
          ? "子節點 " + kids.join("、") + " 會變成最上層的根節點。"
          : "子節點 " + kids.join("、") + " 會少掉這個父節點" + (roots.length
            ? "；" + roots.join("、") + " 沒有其他父節點，會變成最上層的根節點。" : "。")),
      h("p", { class: "muted", style: "margin:4px 0 0" }, "子節點的內文都不會被改動。"));
  }
  openDialog(
    h("h3", {}, "刪除 " + id + "？"),
    h("p", { class: "muted", style: "margin-top:0" }, "檔案會移到 " + lib.dir + sep + ".trash"
      + "，要救回來的話把它搬回理論庫資料夾即可。"),
    kidsPart,
    err,
    h("div", { class: "foot" },
      h("button", { onclick: () => $("#dlg").close() }, "取消"),
      h("button", { class: "danger", onclick: submit }, "刪除")));
}

// zip export / import -------------------------------------------------------------
async function exportZip() {
  try {
    await flushAll();
    const r = await fetch("/api/export", { headers: { "X-Theory-Token": TOKEN } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const url = URL.createObjectURL(await r.blob());
    const d = new Date(), pad = (x) => String(x).padStart(2, "0");
    const a = h("a", { href: url, download: libName() + "-" + d.getFullYear()
      + pad(d.getMonth() + 1) + pad(d.getDate()) + ".zip" });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus("已匯出 " + Object.keys(lib.nodes).length + " 個理論", "ok");
  } catch (e) { setStatus("匯出失敗：" + e.message, "err"); }
}

function fileBase64(file) {
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(r.result.slice(r.result.indexOf(",") + 1));
    r.onerror = () => fail(r.error);
    r.readAsDataURL(file);
  });
}

// nothing is written until the user has seen what the zip would add and replace
async function startImport(ev) {
  const file = ev.target.files[0];
  ev.target.value = "";             // picking the same file again fires change again
  if (!file) return;
  try {
    const zip = await fileBase64(file);
    openImportDialog(file.name, zip, (await api("import_plan", { zip })).result);
  } catch (e) { setStatus("匯入失敗：" + e.message, "err"); }
}

function openImportDialog(fileName, zip, plan) {
  const err = h("div", { class: "err" });
  const names = (ids) => h("p", { class: "muted", style: "margin:2px 0 0" }, ids.join("、"));

  const relabel = () => { go.disabled = !count(); go.textContent = "匯入 " + count() + " 個"; };
  keep.addEventListener("change", relabel);
  replace.addEventListener("change", relabel);
  relabel();
  go.addEventListener("click", async () => {
    try {
      const j = await structural("import", () => ({ zip, overwrite: replace.checked,
        // the versions listed here: one edited since is not replaced unseen

      $("#dlg").close();

      setStatus("已匯入：新增 " + r.added + " 個" + (r.replaced ? "、取代 " + r.replaced + " 個" : ""), "ok");
    } catch (e) { err.textContent = e.message + (e.status === 409 ? "，請重新匯入一次" : ""); }

  openDialog(
    h("h3", {}, "匯入 " + fileName),
    plan.new.length ? h("div", { class: "field" },

    plan.differ.length ? h("div", { class: "field" },
      h("label", {}, plan.differ.length + " 個和理論庫裡的理論同名，但內容不同"),
      names(plan.differ.map((x) => x.id)),
      h("label", { class: "chk" }, keep, h("span", {}, "保留理論庫裡的版本",
        h("small", {}, "zip 裡的這幾個不匯入"))),
      h("label", { class: "chk" }, replace, h("span", {}, "改用 zip 裡的版本",
        h("small", {}, "理論庫裡的版本移到 .trash，要救回來的話把它搬回理論庫資料夾即可")))) : null,
    plan.same.length ? h("p", { class: "muted" },
      plan.same.length + " 個和理論庫裡的內容完全相同，不必匯入。") : null,
    plan.skipped.length ? h("details", {}, h("summary", {}, "略過 " + plan.skipped.length + " 個檔案"),
      h("ul", {}, plan.skipped.map((x) => h("li", {}, x.name + "：" + x.reason)))) : null,
    !plan.new.length && !plan.differ.length
      ? h("p", { class: "muted" }, "這個 zip 裡沒有要匯入的理論。") : null,
    err,
    h("div", { class: "foot" },
      h("button", { onclick: () => $("#dlg").close() }, "取消"), go));
}

// abstraction workspace ---------------------------------------------------------------
function renderWorkspace() {
  swap($("#ws-head"), 
    h("span", {}, h("b", {}, "抽象 " + flow.id), h("span", { class: "muted" }, "：比對子節點並寫出共享骨架")));
  const kids = flow.children.filter((c) => lib.nodes[c]);
  const cols = $("#cols");
  cols.style.setProperty("--ncols", Math.max(kids.length, 1));
  const box = h("div", {}, kids.map((c) => h("div", { class: "col" }, h("h3", {}, c, " ", h("small", {}, "子節點・唯讀")), nodeView(c))));
  if (cols.dataset.html !== box.innerHTML) {
    cols.dataset.html = box.innerHTML;
    cols.replaceChildren(...box.childNodes);
  }
  swap($("#ws-foot"), h("button", { class: "primary", onclick: leaveWorkspace }, "完成，回到理論庫"));
}

// the children keep their full text, so nothing is left to fill in afterwards:
// back in the main view with the new parent selected
async function leaveWorkspace() {
  const id = flow.id;
  await flush(id);
  view = "main";
  flow = null;
  editorFor = null;
  render();
  if (lib.nodes[id]) select(id);
}

// drag a vertical splitter to set a width; the last width sticks per browser
function splitter(handle, target, prop, key, measure, limits) {
  const load = () => { try { return localStorage.getItem(key); } catch (_) { return null; } };
  const saved = load();
  if (saved) target.style.setProperty(prop, saved);
  let startX = 0, startW = 0, w = "";
  const move = (ev) => {
    const [lo, hi] = limits();
    w = Math.round(Math.max(lo, Math.min(hi, startW + ev.clientX - startX))) + "px";
    target.style.setProperty(prop, w);
  };
  handle.addEventListener("mousedown", (ev) => {
    startX = ev.clientX; startW = measure();
    handle.classList.add("drag");
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", () => {
      document.removeEventListener("mousemove", move);
      handle.classList.remove("drag");
      try { if (w) localStorage.setItem(key, w); } catch (_) { /* storage blocked */ }
    }, { once: true });
    ev.preventDefault();
  });
}
splitter($("#tree-handle"), $("#main"), "--tree-w", "theory-dag.tree-w",
  () => $("#tree").offsetWidth, () => [200, Math.min(640, window.innerWidth - 500)]);
splitter($("#divider"), $("#workspace"), "--ed-w", "theory-dag.ed-w",
  () => $("#ws-editor").offsetWidth, () => [320, $("#ws-body").offsetWidth - 327]);

// wiring --------------------------------------------------------------------------
$("#btn-new").addEventListener("click", () => openCreateDialog());
$("#btn-export").addEventListener("click", exportZip);
$("#btn-import").addEventListener("click", () => $("#import-file").click());
$("#import-file").addEventListener("change", startImport);
$("#btn-abstract").addEventListener("click", () => {
  selMode = true; picked.clear(); flow = null; render();
});
$("#filter").addEventListener("input", (ev) => setFilterText(ev.target.value));
$("#filter").addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && filterText) { ev.stopPropagation(); setFilterText(""); }
});
$("#filter-clear").addEventListener("click", () => { setFilterText(""); $("#filter").focus(); });
$("#focus-exit").addEventListener("click", () => setFocusMode(false));
$("#focus-ref").addEventListener("click", () => {
  focusRef = !focusRef;
  store("theory-dag.focus-ref", focusRef ? "1" : "");
  render();
});
$("#btn-logout").addEventListener("click", () => {
  backend.disconnect();
  lib = null;
  selected = null;
  render();
});
// the strip shown at the top of the tree while a row is dragged: dropping there removes the edge
$("#drop-root").addEventListener("dragover", (ev) => overDrop(ev, null));
$("#drop-root").addEventListener("dragleave", (ev) => ev.currentTarget.classList.remove("drop-ok"));
$("#drop-root").addEventListener("drop", (ev) => { ev.preventDefault(); dropOn(null, false); });
NARROW.addEventListener("change", () => { if (lib) render(); });
window.addEventListener("popstate", () => {
  const id = decodeURIComponent(location.hash.slice(1));
  selected = lib && lib.nodes[id] ? id : null;
  narrowTab = "body";
  if (relatedEditing) { flush(relatedEditing); relatedEditing = null; }
  if (lib) render();
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && selMode && !$("#dlg").open) cancelSelect();
  if (ev.key === "Escape" && document.body.classList.contains("focus") && !$("#dlg").open) setFocusMode(false);
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName) || ev.target.isContentEditable;
  if (ev.key === "/" && !typing && !$("#dlg").open && view === "main" && lib && lib.exists
    && !document.body.classList.contains("focus") && !(NARROW.matches && selected)) {
    ev.preventDefault();
    $("#filter").focus();
    $("#filter").select();
  }
});
window.addEventListener("beforeunload", (ev) => {
  if (Object.keys(drafts).length) { flushAll(); ev.preventDefault(); ev.returnValue = ""; }
});

// the first load runs even in a background tab: the browser may open the page
// unfocused, and a page that waits for focus to load looks broken
async function poll(first) {
  if (!backend.ready) { render(); return; }
  if (!first && (document.hidden || writesInFlight)) return;
  const epoch = writeEpoch;
  try {
    const L = await api("library");
    // nothing changed on disk: leave the DOM alone, or a click landing between
    // mousedown and mouseup would hit an element that was just replaced
    if (lib && JSON.stringify(L) === JSON.stringify(lib)) return;
    if (first) {
      const id = decodeURIComponent(location.hash.slice(1));
      if (id && L.nodes[id]) selected = id;
    }
    if (epoch === writeEpoch && !writesInFlight) setLibrary(L);
    if (first) revealSelected();
  }
  catch (e) { setStatus((backend.mode === "server" ? "連不上 server：" : "") + e.message, "err"); }
}
window.addEventListener("focus", () => {
  // back at the page: whatever the phone saved meanwhile should show up now
  if (lib && lib.sync) request("sync_now", {}).catch(() => {});
  poll();
});
setInterval(poll, backend.pollMs);
poll(true);
</script>
